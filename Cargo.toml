[package]
name = "devdash"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "devdash"
path = "src/main.rs"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
sysinfo = "0.33.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
unicode-width = "0.2"
chrono = "0.4"
